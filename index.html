<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E0A21">
<title>Sthezinha Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--noite:#1E0A21;--borda:rgba(251,239,244,.14);--rosa:#FF8FB1;--texto:#FBEFF4;--suave:#C9A6C4;
--ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--ui);background:var(--noite);color:var(--texto);min-height:100vh}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rosa);outline-offset:3px}

.topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
padding:14px clamp(16px,4vw,48px);background:rgba(30,10,33,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--borda)}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.marca svg{width:26px;height:26px}
#busca{width:min(260px,46vw);background:rgba(251,239,244,.07);border:1px solid var(--borda);border-radius:999px;padding:9px 18px;outline-offset:2px}
#busca::placeholder{color:var(--suave)}

.hero{position:relative;overflow:hidden;padding:clamp(40px,9vw,110px) clamp(16px,4vw,48px) clamp(36px,6vw,72px)}
.hero-fundo{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(46px) saturate(1.3);opacity:.55}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(30,10,33,.15),var(--noite) 96%)}
.hero-in{position:relative;z-index:1;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:clamp(24px,5vw,72px);align-items:end}
.hero .poster{width:clamp(180px,22vw,280px)}
.hero-titulo{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,8.5vw,6.4rem);line-height:.95;max-width:14ch}
.meta{display:flex;gap:18px;color:var(--suave);margin:18px 0 12px;font-weight:600}
.sinopse{color:#E9D5E4;max-width:52ch;line-height:1.55;font-size:1.05rem}
.acoes{margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 30px;font-weight:700;font-size:1.05rem;background:var(--rosa);color:var(--noite)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:hover{filter:brightness(1.08)}
@media(max-width:720px){.hero-in{grid-template-columns:1fr}.hero .poster{display:none}}

.catalogo{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 72px}
.catalogo h2{font-size:1.4rem;font-weight:600;margin-bottom:20px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.vazio{color:var(--suave)}
.card{background:none;border:0;padding:0;text-align:left}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#5A2159,#2B0F2E);
box-shadow:0 0 0 1px var(--borda),0 14px 34px rgba(0,0,0,.4)}
.poster img{width:100%;height:100%;object-fit:cover}
.sem{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.card .poster{transition:box-shadow .2s,transform .2s}
.card:hover .poster{transform:translateY(-4px);box-shadow:0 0 0 2px var(--rosa),0 18px 40px rgba(0,0,0,.5)}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,10,33,.45);opacity:0;transition:opacity .2s}
.card:hover .play,.card:focus-visible .play{opacity:1}
.play i{width:56px;height:56px;border-radius:50%;background:var(--rosa);display:grid;place-items:center}
.play svg{width:22px;height:22px;margin-left:3px;fill:var(--noite)}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.prog b{display:block;height:100%;background:var(--rosa)}
.card h3{font-size:1rem;font-weight:600;margin-top:10px;line-height:1.25}
.card small{color:var(--suave)}

dialog{border:0;padding:0;background:transparent;color:var(--texto);width:min(1100px,94vw);max-width:none;margin:auto;overflow:visible}
dialog::backdrop{background:rgba(14,4,16,.88);backdrop-filter:blur(6px)}
.p-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px}
.p-topo h2{font-family:var(--serif);font-weight:400;font-size:1.9rem}
.fechar{border:1px solid var(--borda);background:transparent;border-radius:999px;padding:9px 20px;font-weight:600}
.fechar:hover{border-color:var(--rosa);color:var(--rosa)}
.tela{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tela video,.tela iframe{width:100%;height:100%;border:0;display:block;background:#000}
.aviso{padding:28px;color:var(--suave)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#FF8FB1"/><path d="M12 9l12 7-12 7z" fill="#1E0A21"/></svg>
    Sthezinha Filmes
  </div>
  <input id="busca" type="search" placeholder="Buscar filme" aria-label="Buscar filme">
</header>

<section class="hero" id="hero" hidden></section>

<main class="catalogo">
  <h2>Filmes</h2>
  <div class="grade" id="grade"></div>
</main>

<dialog id="dlg" aria-labelledby="pTitulo">
  <div class="p-topo">
    <h2 id="pTitulo"></h2>
    <button class="fechar" id="fechar" type="button">Fechar</button>
  </div>
  <div class="tela" id="tela"></div>
</dialog>

<script>
// ================= EDITE AQUI =================
window.CONFIG = {
  // Chave da API do Google Drive (opcional).
  // Vazia: o filme abre no player do próprio Drive.
  // Preenchida: toca no player do site e lembra onde você parou.
  apiKey: "",

  // Para adicionar outro filme, copie um bloco { ... } e separe por vírgula.
  // player: "drive" força o player do Drive (use em .mkv). chave: resourcekey do link, se houver.
  filmes: [
    {
      titulo: "Orgulho e Preconceito",
      ano: "2005",
      duracao: "2h 9min",
      sinopse: "Na Inglaterra do século XIX, a decidida Elizabeth Bennet conhece o reservado Sr. Darcy, e os dois precisam vencer o orgulho e os preconceitos que os mantêm distantes.",
      capa: "https://i.postimg.cc/y85BY0Sc/e47c87e8f8d0f8c752c81444e9b6cb7e-2970105409.jpg",
      driveId: "185blROfFpOWduXCxe-9QEBLYtSFvn9PL",
      player: "drive",   // arquivo .mkv: o navegador não toca, então usa o player do Drive
      destaque: true
    },
    {
      titulo: "Antes da Meia Noite",
      ano: "2013",
      duracao: "1h 49min",
      sinopse: "Jesse e Céline, agora casados e com duas filhas, passam as férias na Grécia, e uma noite de conversas coloca o relacionamento à prova.",
      capa: "https://i.postimg.cc/sg1srT14/21012323-20130613143708915-1653446488.jpg",
      driveId: "0B6G2qyZ9G8kOTW1Nei1Rb1FaNVk",
      chave: "0-oav9NsMQeKNheb2dVKuwDQ",   // resourcekey do link (arquivos mais antigos do Drive)
      player: "drive"
    }
  ]
};
// ==============================================
</script>
<script>
const {apiKey="",filmes=[]}=window.CONFIG||{};
const $=id=>document.getElementById(id);
const PLAY='<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const lerProg=id=>{try{return JSON.parse(localStorage.getItem("prog:"+id))}catch{return null}};
const salvarProg=(id,t,d)=>{try{localStorage.setItem("prog:"+id,JSON.stringify({t,d}))}catch{}};
const pct=f=>{const p=lerProg(f.driveId);return p&&p.d?Math.min(100,p.t/p.d*100):0};

function poster(f){
  const el=document.createElement("div");el.className="poster";
  const sem=document.createElement("div");sem.className="sem";sem.textContent=f.titulo;el.append(sem);
  const img=new Image();img.alt="";
  img.onload=()=>{sem.remove();el.prepend(img)};
  if(f.capa)img.src=f.capa;
  return el;
}

function hero(){
  const f=filmes.find(x=>x.destaque)||filmes[0];
  const h=$("hero");
  if(!f)return;
  h.hidden=false;h.innerHTML="";
  const fundo=document.createElement("div");fundo.className="hero-fundo";
  if(f.capa)fundo.style.backgroundImage='url("'+f.capa+'")';
  const inn=document.createElement("div");inn.className="hero-in";
  const txt=document.createElement("div");
  const t=document.createElement("h1");t.className="hero-titulo";t.textContent=f.titulo;
  const meta=document.createElement("div");meta.className="meta";
  [f.ano,f.duracao].filter(Boolean).forEach(x=>{const s=document.createElement("span");s.textContent=x;meta.append(s)});
  const sin=document.createElement("p");sin.className="sinopse";sin.textContent=f.sinopse||"";
  const ac=document.createElement("div");ac.className="acoes";
  const b=document.createElement("button");b.className="btn";b.type="button";
  b.innerHTML=PLAY+"<span></span>";
  b.lastChild.textContent=pct(f)>0?"Continuar":"Assistir";
  b.onclick=()=>abrir(f);
  ac.append(b);txt.append(t,meta,sin,ac);
  inn.append(txt,poster(f));
  h.append(fundo,inn);
}

function desenhar(){
  const g=$("grade");g.innerHTML="";
  if(!filmes.length){g.innerHTML='<p class="vazio">Adicione seus filmes na área “Edite aqui” do index.html.</p>';return}
  const q=norm($("busca").value.trim());
  const lista=filmes.filter(f=>norm(f.titulo).includes(q));
  if(!lista.length){g.innerHTML='<p class="vazio">Nenhum filme encontrado.</p>';return}
  lista.forEach(f=>{
    const b=document.createElement("button");b.className="card";b.type="button";
    const p=poster(f);
    const play=document.createElement("div");play.className="play";play.innerHTML="<i>"+PLAY+"</i>";p.append(play);
    const pr=pct(f);
    if(pr>0){const d=document.createElement("div");d.className="prog";d.innerHTML='<b style="width:'+pr+'%"></b>';p.append(d)}
    const h=document.createElement("h3");h.textContent=f.titulo;
    b.append(p,h);
    if(f.ano){const s=document.createElement("small");s.textContent=f.ano;b.append(s)}
    b.onclick=()=>abrir(f);
    g.append(b);
  });
}

let video=null,atual=null,ultimo=0;

function usarIframe(f){
  const tela=$("tela");tela.innerHTML="";video=null;
  const i=document.createElement("iframe");
  i.src="https://drive.google.com/file/d/"+encodeURIComponent(f.driveId)+"/preview"+(f.chave?"?resourcekey="+encodeURIComponent(f.chave):"");
  i.allow="autoplay; fullscreen";i.allowFullscreen=true;i.title=f.titulo;
  tela.append(i);
}

function abrir(f){
  atual=f;$("pTitulo").textContent=f.titulo;
  const tela=$("tela");tela.innerHTML="";video=null;
  $("dlg").showModal();
  if(!f.driveId||f.driveId.startsWith("COLE_AQUI")){
    tela.innerHTML='<p class="aviso">Falta colocar o ID do Drive deste filme no index.html.</p>';return;
  }
  if(!apiKey||f.player==="drive"){usarIframe(f);return}
  const v=document.createElement("video");
  v.controls=true;v.autoplay=true;v.playsInline=true;v.preload="metadata";
  v.src="https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(f.driveId)+"?alt=media&key="+encodeURIComponent(apiKey);
  v.addEventListener("loadedmetadata",()=>{
    const p=lerProg(f.driveId);
    if(p&&p.t>10&&p.t<v.duration-30)v.currentTime=p.t;
  });
  v.addEventListener("timeupdate",()=>{
    const n=Date.now();
    if(n-ultimo>4000){ultimo=n;salvarProg(f.driveId,v.currentTime,v.duration)}
  });
  v.addEventListener("error",()=>usarIframe(f));
  tela.append(v);video=v;
}

$("fechar").onclick=()=>$("dlg").close();
$("dlg").addEventListener("close",()=>{
  if(video&&atual&&video.duration)salvarProg(atual.driveId,video.currentTime,video.duration);
  $("tela").innerHTML="";video=null;hero();desenhar();
});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("busca").addEventListener("input",desenhar);

hero();desenhar();
</script>
</body>
</html>
