<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E0A21">
<link rel="icon" href="https://i.postimg.cc/rsPJByK9/Emblema-Romantico-Sthezinha-Filmes.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/rsPJByK9/Emblema-Romantico-Sthezinha-Filmes.png">
<meta property="og:title" content="Sthezinha Filmes">
<meta property="og:image" content="https://i.postimg.cc/rsPJByK9/Emblema-Romantico-Sthezinha-Filmes.png">
<title>Sthezinha Filmes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--noite:#1E0A21;--borda:rgba(251,239,244,.14);--rosa:#FF8FB1;--texto:#FBEFF4;--suave:#C9A6C4;
--ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--ui);background:var(--noite);color:var(--texto);min-height:100vh}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rosa);outline-offset:3px}

.topo{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
padding:14px clamp(16px,4vw,48px);background:rgba(30,10,33,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--borda)}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.marca svg{width:26px;height:26px}
#busca{width:min(260px,46vw);background:rgba(251,239,244,.07);border:1px solid var(--borda);border-radius:999px;padding:9px 18px;outline-offset:2px}
#busca::placeholder{color:var(--suave)}


.central{position:relative;overflow:hidden;isolation:isolate;min-height:calc(100vh - 74px);display:flex;align-items:center;justify-content:center;gap:clamp(24px,5vw,64px);
padding:clamp(24px,5vw,56px) clamp(16px,5vw,64px) 84px;background:radial-gradient(ellipse at 30% 30%,#4A1A4A 0%,#1E0A21 72%);color:#FBEFF4}
.fundo{position:absolute;inset:-80px;z-index:-2;background-size:cover;background-position:center;filter:blur(50px) saturate(1.3);opacity:.6;animation:aparece .8s ease both}
.central::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(30,10,33,.25),rgba(30,10,33,.85))}
@keyframes aparece{from{opacity:0}to{opacity:.6}}
.fixa{position:fixed;top:50%;transform:translateY(-50%);z-index:15;background:rgba(30,10,33,.65);backdrop-filter:blur(6px);transition:opacity .25s}
.fixa.esq{left:clamp(8px,2vw,28px)}.fixa.dir{right:clamp(8px,2vw,28px)}
.no-hero .fixa{opacity:0;pointer-events:none}
.rolar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:#C9A6C4;font-weight:600;font-size:.9rem;padding:8px 14px}
.rolar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rolar:hover{color:#FF8FB1}
.catalogo{max-width:1200px;margin:0 auto;padding:56px clamp(16px,4vw,48px) 80px}
.catalogo h2{font-family:var(--serif);font-weight:400;font-size:2.2rem;margin-bottom:24px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px}
.card{background:none;border:0;padding:0;text-align:left;color:var(--texto)}
.card .poster{transition:box-shadow .2s,transform .2s}
.card:hover .poster,.card.atual .poster{transform:translateY(-4px);box-shadow:0 0 0 2px var(--rosa),0 18px 40px rgba(0,0,0,.5)}
.card h3{font-size:1rem;font-weight:600;margin-top:10px;line-height:1.25}
.card small{color:var(--suave)}
.texto{flex:1;max-width:560px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;animation:entra .45s ease both}
.saudacao{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:#FF8FB1}
.eyebrow{font-size:.8rem;letter-spacing:.22em;font-weight:600;color:#FF8FB1}
.centro-t{font-family:var(--serif);font-weight:400;font-size:clamp(2.8rem,7vw,5.4rem);line-height:.95}
.meta{display:flex;gap:18px;color:#C9A6C4;font-weight:600}
.sinopse{color:#E9D5E4;line-height:1.5;font-size:1.1rem;font-weight:300}
.nota{padding-left:16px;border-left:3px solid #FF8FB1;font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,2vw,1.4rem);line-height:1.35;color:#F3DDE9}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:14px 32px;font-weight:700;font-size:1.05rem;background:#FF8FB1;color:#1E0A21;margin-top:6px}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:hover{filter:brightness(1.1)}
.nav{display:flex;align-items:center;gap:14px;margin-top:10px}
.seta{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(251,239,244,.3);background:transparent;display:grid;place-items:center;padding:0;transition:border-color .2s,background .2s}
.seta:hover{border-color:#FF8FB1;background:rgba(255,143,177,.12)}
.seta svg{width:20px;height:20px;fill:none;stroke:#FBEFF4;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pontos{display:flex;gap:10px;align-items:center}
.pontos button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:rgba(251,239,244,.3);transition:width .2s,background .2s}
.pontos button.on{width:28px;background:#FF8FB1}
.colecao{display:flex;align-items:flex-end;gap:clamp(10px,2vw,20px);animation:entra .45s ease both}
.item{background:none;border:0;padding:0;text-align:center;width:clamp(100px,13vw,150px);opacity:.75;transition:opacity .2s,transform .2s;color:#FBEFF4}
.item:hover{opacity:1;transform:translateY(-3px)}
.item.on{width:clamp(150px,19vw,210px);opacity:1}
.item .ano{display:block;margin-top:10px;font-weight:600;font-size:.95rem}
.item.on .ano{font-weight:800;color:#FF8FB1}
.central .poster{box-shadow:0 0 0 1px rgba(251,239,244,.14),0 18px 44px rgba(0,0,0,.45)}
dialog>@media(max-width:720px){
dialog{width:100vw}
.tela{position:relative}
.p-topo{padding:0 14px 10px;flex-wrap:wrap}
.p-topo h2{font-size:1.4rem}
.palco{overflow:visible;border-radius:0;box-shadow:none}
.tela{overflow:visible;border-radius:0;box-shadow:none}
}
.nota-rotulo{display:block;margin-bottom:6px;font-family:var(--ui);font-style:normal;font-size:.75rem;letter-spacing:.2em;font-weight:600;color:#FF8FB1}
.vazio{color:#C9A6C4}
@media(max-width:820px){.central{flex-direction:column-reverse;justify-content:flex-start}.texto{max-width:none}}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#5A2159,#2B0F2E);
box-shadow:0 0 0 1px var(--borda),0 14px 34px rgba(0,0,0,.4)}
.poster img{width:100%;height:100%;object-fit:cover}
.sem{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font-family:var(--serif);font-size:1.6rem;line-height:1.1}
dialog{border:0;padding:0;background:transparent;color:var(--texto);width:min(1100px,94vw);max-width:none;margin:auto;overflow:visible}
dialog::backdrop{background:rgba(14,4,16,.88);backdrop-filter:blur(6px)}
.p-topo{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px}
.p-topo h2{font-family:var(--serif);font-weight:400;font-size:1.9rem}
.fechar{border:1px solid var(--borda);background:transparent;border-radius:999px;padding:9px 20px;font-weight:600}
.fechar:hover{border-color:var(--rosa);color:var(--rosa)}
.tela{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.tela video,.tela iframe{width:100%;height:100%;border:0;display:block;background:#000}
.aviso{padding:28px;color:var(--suave)}
.p-acoes{display:flex;gap:10px}
.palco{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.fim{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:28px;text-align:center;
background:rgba(30,10,33,.92);backdrop-filter:blur(8px)}
.fim[hidden]{display:none}
.fim-msg{font-family:var(--serif);font-size:clamp(1.6rem,4.4vw,3rem);line-height:1.15;max-width:22ch}
.fim-acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.logo{height:44px;width:auto;display:block}
.abertura{position:fixed;inset:0;z-index:100;display:grid;place-items:center;cursor:pointer;
background:radial-gradient(ellipse at 50% 40%,#3D1640 0%,var(--noite) 70%);transition:opacity .7s}
.abertura img{width:min(340px,72vw);max-height:60vh;object-fit:contain;animation:entra 1.2s ease both}
.abertura.some{opacity:0;pointer-events:none}
@keyframes entra{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:720px){.palco,.tela{overflow:visible;border-radius:0;box-shadow:none}.tela{position:relative}}
.sair-cheia{position:absolute;top:10px;left:10px;z-index:5;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font-size:.85rem;font-weight:600;padding:8px 14px}
@media(max-width:720px){#cheia:not([hidden]){display:inline-block}}
#cheia{display:none}
</style>
</head>

<div class="abertura" id="abertura" aria-hidden="true"><img src="https://i.postimg.cc/rsPJByK9/Emblema-Romantico-Sthezinha-Filmes.png" alt=""></div>

<header class="topo">
  <div class="marca"><img class="logo" src="https://i.postimg.cc/rsPJByK9/Emblema-Romantico-Sthezinha-Filmes.png" alt="" onerror="this.remove()"><span>Sthezinha Filmes</span></div>
  <input id="busca" type="search" placeholder="Buscar filme" aria-label="Buscar filme">
</header>

<main class="central" id="central"></main>

<section class="catalogo" id="catalogo"><h2>Todos os filmes</h2><div class="grade" id="grade"></div></section>

<dialog id="dlg" aria-labelledby="pTitulo">
  <div class="p-topo">
    <h2 id="pTitulo"></h2>
    <div class="p-acoes">
      <button class="fechar" id="cheia" type="button" hidden>Tela cheia</button>
      <button class="fechar" id="terminei" type="button">Terminei</button>
      <button class="fechar" id="fechar" type="button">Fechar</button>
    </div>
  </div>
  <div class="palco" id="palco">
    <div class="tela" id="tela"></div>
    <button class="sair-cheia" id="sairCheia" type="button" hidden>Sair da tela cheia</button>
    <div class="fim" id="fim" hidden>
      <p class="fim-msg" id="fimMsg"></p>
      <div class="fim-acoes">
        <button class="btn" id="denovo" type="button">Ver de novo</button>
        <button class="fechar" id="voltar" type="button">Voltar ao catálogo</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const {apiKey="",filmes=[],nome="",fimPadrao="Fim. Foi uma ótima sessão."}=window.CONFIG||{};
const $=id=>document.getElementById(id);
const PLAY='<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>';
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const lerProg=id=>{try{return JSON.parse(localStorage.getItem("prog:"+id))}catch{return null}};
const salvarProg=(id,t,d)=>{try{localStorage.setItem("prog:"+id,JSON.stringify({t,d}))}catch{}};
const pct=f=>{const p=lerProg(f.driveId);return p&&p.d?Math.min(100,p.t/p.d*100):0};

function poster(f){
  const el=document.createElement("div");el.className="poster";
  const sem=document.createElement("div");sem.className="sem";sem.textContent=f.titulo;el.append(sem);
  const img=new Image();img.alt="";
  img.onload=()=>{sem.remove();el.prepend(img)};
  if(f.capa)img.src=f.capa;
  return el;
}

function saudacao(){
  const h=new Date().getHours();
  const periodo=h>=5&&h<12?"Bom dia":h>=12&&h<18?"Boa tarde":"Boa noite";
  return nome?periodo+", "+nome:periodo;
}

let idx=Math.max(0,filmes.findIndex(x=>x.destaque));
const ROTULO_NOTA="NOTAS DE GUSTAVO";
const ICONE={e:'<path d="M15 5l-7 7 7 7"/>',d:'<path d="M9 5l7 7-7 7"/>'};
const lista=()=>{const q=norm($("busca").value.trim());return filmes.filter(f=>norm(f.titulo).includes(q))};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
function seta(dir,rotulo,fn){
  const b=el("button","seta");b.type="button";b.setAttribute("aria-label",rotulo);
  b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONE[dir]+'</svg>';b.onclick=fn;return b;
}
function ir(n,l){idx=(n+l.length)%l.length;carrossel()}

function carrossel(){
  const c=$("central");c.innerHTML="";
  const l=lista();
  if(!filmes.length){c.append(el("p","vazio","Adicione seus filmes na área “Edite aqui” do index.html."));return}
  if(!l.length){c.append(el("p","vazio","Nenhum filme encontrado."));return}
  if(idx>=l.length)idx=0;
  const f=l[idx],n=l.length;
  const grupo=f.serie?filmes.filter(x=>x.serie===f.serie):[f];

  if(f.capa){const fd=el("div","fundo");fd.style.backgroundImage='url("'+f.capa+'")';c.append(fd)}
  const t=el("div","texto");
  t.append(el("p","saudacao",saudacao()));
  if(f.serie)t.append(el("div","eyebrow",(grupo.length===3?"TRILOGIA":"COLEÇÃO")+" · "+f.serie.toUpperCase()));
  t.append(el("h1","centro-t",f.titulo));
  const meta=el("div","meta");
  [f.ano,f.duracao].filter(Boolean).forEach(x=>meta.append(el("span",null,x)));
  t.append(meta);
  if(f.sinopse)t.append(el("p","sinopse",f.sinopse));
  if(f.nota){const nb=el("div","nota");nb.append(el("span","nota-rotulo",ROTULO_NOTA),el("p",null,f.nota));t.append(nb)}
  const pr=pct(f);
  const b=el("button","btn");b.type="button";
  b.innerHTML=PLAY+"<span></span>";
  b.lastChild.textContent=pr>0?"Continuar":"Assistir";
  b.onclick=()=>abrir(f);
  t.append(b);
  if(n>1){
    const nav=el("div","nav");
    const pt=el("div","pontos");
    l.forEach((x,i)=>{const d=el("button",i===idx?"on":"");d.type="button";d.setAttribute("aria-label",x.titulo);d.onclick=()=>{idx=i;carrossel()};pt.append(d)});
    nav.append(pt);
    t.append(nav);
  }

  const col=el("div","colecao");
  grupo.forEach(g=>{
    const it=el("button","item"+(g===f?" on":""));it.type="button";
    it.setAttribute("aria-label",g===f?"Assistir "+g.titulo:"Ver "+g.titulo);
    const p=poster(g);
    if(g===f&&pr>0){const d=el("div","prog");d.innerHTML='<b style="width:'+pr+'%"></b>';p.append(d)}
    it.append(p);
    if(g.ano)it.append(el("span","ano",g.ano));
    it.onclick=()=>{if(g===f)abrir(g);else{const i=l.indexOf(g);if(i>=0){idx=i;carrossel()}}};
    col.append(it);
  });
  c.append(t,col);
  if(n>1){
    const e=seta("e","Filme anterior",()=>ir(idx-1,l));e.classList.add("fixa","esq");
    const d=seta("d","Próximo filme",()=>ir(idx+1,l));d.classList.add("fixa","dir");
    c.append(e,d);
  }
  const r=el("button","rolar");r.type="button";
  r.innerHTML='<span>Todos os filmes</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  r.onclick=()=>$("catalogo").scrollIntoView({behavior:"smooth"});
  c.append(r);
  catalogo(l);
}

function catalogo(l){
  const g=$("grade");g.innerHTML="";
  l.forEach((f,i)=>{
    const b=el("button","card"+(i===idx?" atual":""));b.type="button";
    const p=poster(f);const pr=pct(f);
    if(pr>0){const d=el("div","prog");d.innerHTML='<b style="width:'+pr+'%"></b>';p.append(d)}
    b.append(p,el("h3",null,f.titulo));
    if(f.ano)b.append(el("small",null,f.ano));
    b.onclick=()=>{idx=i;carrossel();window.scrollTo({top:0,behavior:"smooth"})};
    g.append(b);
  });
}

let video=null,atual=null,ultimo=0;

function usarIframe(f){
  const tela=$("tela");tela.innerHTML="";video=null;
  const i=document.createElement("iframe");
  i.src="https://drive.google.com/file/d/"+encodeURIComponent(f.driveId)+"/preview"+(f.chave?"?resourcekey="+encodeURIComponent(f.chave):"");
  i.allow="autoplay; fullscreen";i.allowFullscreen=true;i.title=f.titulo;
  tela.append(i);
  if(matchMedia("(max-width:720px)").matches){
    const W=640,H=520,k=tela.clientWidth/W;
    tela.style.aspectRatio="auto";tela.style.height=Math.round(k*H)+"px";
    i.style.cssText="position:absolute;left:0;top:0;width:"+W+"px;height:"+H+"px;transform-origin:0 0;transform:scale("+k+")";
  }
}

const reduz=matchMedia("(prefers-reduced-motion: reduce)").matches;
let terminou=false;
const limparProg=id=>{try{localStorage.removeItem("prog:"+id)}catch{}};

function mostrarFim(){
  if(!atual)return;
  terminou=true;limparProg(atual.driveId);
  $("fimMsg").textContent=atual.fim||fimPadrao;
  $("fim").hidden=false;
  if(video)video.pause();
}

function abrir(f){
  atual=f;terminou=false;
  $("pTitulo").textContent=f.titulo;
  const tela=$("tela");tela.innerHTML="";tela.removeAttribute("style");video=null;
  $("fim").hidden=true;
  
  $("dlg").showModal();
  if(!f.driveId||f.driveId.startsWith("COLE_AQUI")){
    tela.innerHTML='<p class="aviso">Falta colocar o ID do Drive deste filme no index.html.</p>';return;
  }
  if(!apiKey||f.player==="drive")usarIframe(f);
  else{
    const v=document.createElement("video");
    v.controls=true;v.playsInline=true;v.preload="metadata";
    v.src="https://www.googleapis.com/drive/v3/files/"+encodeURIComponent(f.driveId)+"?alt=media&key="+encodeURIComponent(apiKey);
    v.addEventListener("loadedmetadata",()=>{
      const p=lerProg(f.driveId);
      if(p&&p.t>10&&p.t<v.duration-30)v.currentTime=p.t;
    });
    v.addEventListener("timeupdate",()=>{
      const n=Date.now();
      if(n-ultimo>4000){ultimo=n;salvarProg(f.driveId,v.currentTime,v.duration)}
    });
    v.addEventListener("ended",mostrarFim);
    v.addEventListener("error",()=>usarIframe(f));
    tela.append(v);video=v;
  }
  if(video)video.play().catch(()=>{});
}

let guardado=null;
function aplicarCheia(){
  const p=$("palco"),t=$("tela"),f=t.firstElementChild;
  const w=innerWidth,h=innerHeight,port=h>w,W=port?h:w,H=port?w:h;
  p.style.cssText="position:fixed;top:0;left:0;width:"+W+"px;height:"+H+"px;z-index:300;background:#000;border-radius:0;box-shadow:none;overflow:visible;"+(port?"transform-origin:0 0;transform:translateX("+w+"px) rotate(90deg);":"");
  t.style.cssText="position:absolute;left:0;top:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none;overflow:visible";
  if(f&&f.tagName==="IFRAME")f.style.cssText="position:absolute;left:0;top:0;width:100%;height:100%;border:0";
}
function entrarCheia(){
  const p=$("palco"),t=$("tela"),f=t.firstElementChild;
  if(p.classList.contains("cheia"))return;
  guardado={t:t.style.cssText,f:f?f.style.cssText:""};
  p.classList.add("cheia");$("sairCheia").hidden=false;aplicarCheia();
}
function sairCheia(){
  const p=$("palco"),t=$("tela"),f=t.firstElementChild;
  if(!p.classList.contains("cheia"))return;
  p.classList.remove("cheia");p.removeAttribute("style");$("sairCheia").hidden=true;
  if(guardado){t.style.cssText=guardado.t;if(f)f.style.cssText=guardado.f}
}
$("cheia").hidden=false;
$("cheia").onclick=entrarCheia;
$("sairCheia").onclick=sairCheia;
addEventListener("resize",()=>{if($("palco").classList.contains("cheia"))aplicarCheia()});
$("fechar").onclick=()=>$("dlg").close();
$("voltar").onclick=()=>$("dlg").close();
$("terminei").onclick=mostrarFim;
$("denovo").onclick=()=>{
  terminou=false;$("fim").hidden=true;
  if(video){video.currentTime=0;video.play().catch(()=>{})}
  else if(atual)usarIframe(atual);
};
$("dlg").addEventListener("close",()=>{
  sairCheia();
  if(video&&atual&&video.duration&&!terminou)salvarProg(atual.driveId,video.currentTime,video.duration);
  $("tela").innerHTML="";video=null;carrossel();
});
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
$("busca").addEventListener("input",()=>{idx=0;carrossel()});
new IntersectionObserver(([en])=>document.body.classList.toggle("no-hero",!en.isIntersecting),{threshold:.3}).observe($("central"));
document.addEventListener("keydown",e=>{
  if($("dlg").open||e.target===$("busca"))return;
  const l=lista();if(l.length<2)return;
  if(e.key==="ArrowLeft")ir(idx-1,l);else if(e.key==="ArrowRight")ir(idx+1,l);
});
let x0=null,y0=null;
$("central").addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
$("central").addEventListener("touchend",e=>{
  if(x0==null)return;
  const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=y0=null;
  const l=lista();
  if(l.length>1&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*2)ir(idx+(dx<0?1:-1),l);
});
$("central").addEventListener("touchcancel",()=>{x0=y0=null});

carrossel();

const ab=$("abertura");
const fecharAbertura=()=>{ab.classList.add("some");setTimeout(()=>ab.remove(),800)};
ab.querySelector("img").addEventListener("error",()=>ab.remove());
if(reduz)ab.remove();
else{setTimeout(fecharAbertura,2400);ab.addEventListener("click",fecharAbertura)}
</script>
</body>
</html>
